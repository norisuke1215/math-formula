<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学問題演習アプリ（メール通知・手動採点対応）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for rendering math equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { user-select: none; -webkit-user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }
        .tab-btn.active { color: #3b82f6; border-top: 3px solid #3b82f6; background-color: #eff6ff; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between pb-20">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg">$\sum$</div>
                <h1 class="text-xl font-bold text-slate-800">数学演習</h1>
            </div>
            <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-medium" id="header-stats">問題数: 0</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow">

        <!-- TAB 1: PRACTICE SECTION (生徒解答画面) -->
        <section id="tab-practice" class="tab-content block space-y-6">
            <!-- 生徒名入力欄 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center gap-3">
                <i class="fa-solid fa-user text-slate-400"></i>
                <input type="text" id="student-name" placeholder="お名前を入力してください（例: 山田太郎）" class="w-full text-sm border-none focus:outline-none focus:ring-0 text-slate-700 font-semibold">
            </div>

            <!-- 進捗バー -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase">学習進捗</span>
                    <span id="practice-counter" class="text-xs font-bold text-blue-600">問題 1 / 1</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="practice-progress" class="bg-blue-600 h-2.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <!-- 問題カード -->
            <div id="practice-card" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                    <span id="problem-category" class="bg-indigo-50 text-indigo-600 text-xs px-3 py-1 rounded-md font-semibold">カテゴリ</span>
                    <span id="practice-progress-text" class="text-xs text-slate-500 font-medium">問題 1 / 1</span>
                </div>

                <div class="py-2">
                    <h2 class="text-sm text-slate-400 font-medium mb-1">【問題】</h2>
                    <div id="problem-statement" class="text-lg md:text-xl text-slate-800 font-medium leading-relaxed min-h-[60px] flex items-center">
                        問題文がここに表示されます。
                    </div>
                </div>

                <!-- 解答入力 -->
                <div class="pt-2 border-t border-slate-100 space-y-3">
                    <label class="block text-sm font-medium text-slate-700">あなたの解答</label>
                    <div class="flex flex-wrap gap-1 mb-2">
                        <button type="button" onclick="insertAnswerSymbol('\\int_{a}^{b}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">∫</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sum_{k=1}^{n}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">∑</button>
                        <button type="button" onclick="insertAnswerSymbol('{}_n \\mathrm{C}_r')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">${}_n \mathrm{C}_r$</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sqrt{}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">√</button>
                        <button type="button" onclick="insertAnswerSymbol('\\pi')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">π</button>
                        <button type="button" onclick="insertAnswerSymbol('\\theta')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">θ</button>
                        <button type="button" onclick="insertAnswerSymbol('^2')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">x²</button>
                        <button type="button" onclick="insertAnswerSymbol('\\frac{a}{b}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">½</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sin x')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">$\sin x$</button>
                        <button type="button" onclick="insertAnswerSymbol('\\cos x')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">$\cos x$</button>
                        
                    </div>

                    <input type="text" id="user-answer" placeholder="答えを入力" oninput="saveAndPreviewAnswer()" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg">
                    <div id="user-answer-preview" class="hidden p-3 bg-slate-50 border-l-4 border-blue-500 rounded-r-xl text-slate-800 text-lg min-h-[50px]"></div>
                </div>

                <!-- ボタン部 -->
                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <button id="btn-prev" onclick="prevProblem()" class="px-4 py-2.5 bg-white border border-slate-300 text-slate-600 rounded-xl font-medium hover:bg-slate-50 text-sm">前へ</button>
                    <button id="btn-next" onclick="nextProblem()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 text-sm">次へ</button>
                    <button id="btn-submit-all" onclick="submitToGrading()" class="hidden px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> 解答を送信・提出する
                    </button>
                </div>
            </div>

            <!-- 送信完了画面 -->
            <div id="submitted-card" class="hidden bg-white p-8 rounded-2xl shadow-sm border border-slate-200 text-center space-y-4">
                <div class="text-5xl text-emerald-500 mb-2"><i class="fa-solid fa-circle-check"></i></div>
                <h2 class="text-2xl font-bold text-slate-800">解答を提出・送信しました！</h2>
                <p class="text-slate-600 text-sm">先生のメール（fu1215ke@gmail.com）宛に解答内容が通知されました。</p>
                <button onclick="resetPractice()" class="px-6 py-2.5 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700">もう一度解く</button>
            </div>
        </section>

        <!-- TAB 2: GRADING SECTION (先生採点用) -->
        <section id="tab-grading" class="tab-content hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex justify-between items-center border-b pb-4 border-slate-100">
                    <div>
                        <h2 class="text-xl font-bold text-slate-800">先生用採点画面</h2>
                        <p class="text-xs text-slate-500">◯ / ✕ ボタンで手動採点できます。</p>
                    </div>
                    <div id="grading-score" class="text-lg font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">得点: - / -</div>
                </div>
                <div id="grading-list" class="space-y-6"></div>
            </div>
        </section>

        <!-- TAB 3: MANAGEMENT SECTION -->
        <section id="tab-manage" class="tab-content hidden space-y-6">
            <!-- Webhook設定 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-envelope text-blue-600"></i> メール通知設定（GAS連携）
                </h2>
                <p class="text-xs text-slate-500">Google Apps Scriptで発行したWeb App URLを設定すると、提出時に <strong>fu1215ke@gmail.com</strong> へメールが届きます。</p>
                <div class="flex gap-2">
                    <input type="url" id="webhook-url" placeholder="https://script.google.com/macros/s/.../exec" class="flex-grow px-3 py-2 border rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button onclick="saveWebhookUrl()" class="px-4 py-2 bg-slate-800 text-white text-xs font-semibold rounded-lg hover:bg-slate-700">保存</button>
                </div>
            </div>

            <!-- 問題追加フォーム -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                <div class="flex justify-between items-center">
                    <h2 id="form-title" class="text-lg font-bold text-slate-800">問題の追加</h2>
                    <button id="btn-cancel-edit" onclick="resetForm()" class="hidden text-xs text-rose-500 hover:underline">キャンセル</button>
                </div>
                <form id="problem-form" onsubmit="saveProblem(event)" class="space-y-4">
                    <input type="hidden" id="edit-problem-id" value="">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">カテゴリー</label>
                        <input type="text" id="input-category" required placeholder="例: 積分法" class="w-full px-3 py-2 rounded-lg border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">問題文 (TeXは $ で囲む)</label>
                        <textarea id="input-statement" required rows="3" placeholder="例: $\int_{0}^{1} 2x dx$ を計算せよ。" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">模範解答</label>
                        <input type="text" id="input-answer" required placeholder="例: 1" class="w-full px-3 py-2 rounded-lg border text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">解説</label>
                        <textarea id="input-explanation" required rows="2" placeholder="解説を入力" class="w-full px-3 py-2 rounded-lg border text-sm"></textarea>
                    </div>
                    <button type="submit" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl text-sm">登録保存</button>
                </form>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800">問題一覧</h2>
                <div id="problems-list" class="divide-y divide-slate-100"></div>
            </div>
        </section>

        <!-- TAB 4: MEMO SECTION -->
        <section id="tab-board" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center pb-2 border-b">
                    <h2 class="text-base font-bold text-slate-800"><i class="fa-solid fa-pen-ruler text-blue-600"></i> 計算用紙</h2>
                    <div class="flex items-center gap-2">
                        <button onclick="setPenColor('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800"></button>
                        <button onclick="setPenColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500"></button>
                        <button onclick="setPenColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500"></button>
                        <button id="btn-eraser" onclick="toggleEraser()" class="px-2 py-1 bg-slate-100 text-xs rounded">消しゴム</button>
                        <button onclick="clearCanvas()" class="px-2 py-1 bg-rose-50 text-rose-600 text-xs rounded">全消去</button>
                    </div>
                </div>
                <div class="relative w-full bg-slate-50 border rounded-xl overflow-hidden" style="height: 400px;">
                    <canvas id="memo-canvas" class="w-full h-full cursor-crosshair"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t z-40">
        <div class="max-w-3xl mx-auto flex justify-around">
            <button onclick="switchTab('tab-practice')" id="nav-tab-practice" class="tab-btn active flex-1 py-3 flex flex-col items-center text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-graduation-cap text-base"></i> 演習
            </button>
            <button onclick="switchTab('tab-grading')" id="nav-tab-grading" class="tab-btn flex-1 py-3 flex flex-col items-center text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-check-double text-base"></i> 採点
            </button>
            <button onclick="switchTab('tab-manage')" id="nav-tab-manage" class="tab-btn flex-1 py-3 flex flex-col items-center text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-list-check text-base"></i> 管理・設定
            </button>
            <button onclick="switchTab('tab-board')" id="nav-tab-board" class="tab-btn flex-1 py-3 flex flex-col items-center text-slate-500 text-xs font-semibold">
                <i class="fa-solid fa-pen-to-square text-base"></i> 計算用紙
            </button>
        </div>
    </nav>

    <!-- JavaScript Script -->
    <script>
        const defaultProblems = [
            { id: 1, category: "積分法", statement: "$\\int_{0}^{1} 2x \\, dx$ を計算せよ。", answer: "1", explanation: "不定積分は $x^2 + C$ です。$[x^2]_0^1 = 1 - 0 = 1$。" },
            { id: 2, category: "二次関数", statement: "二次関数 $y = x^2 - 4x + 3$ の頂点の $y$ 座標を求めよ。", answer: "-1", explanation: "平方完成すると $(x-2)^2 - 1$ となり、$y$ 座標は $-1$ です。" }
        ];

        let problems = [];
        let currentProblemIndex = 0;
        let userAnswers = {};
        let manualGrades = {};

        document.addEventListener("DOMContentLoaded", () => {
            loadProblems();
            loadWebhookUrl();
            renderPracticeProblem();
            renderProblemsList();
            initCanvas();
        });

        function loadProblems() {
            const saved = localStorage.getItem("math_app_problems");
            problems = saved ? JSON.parse(saved) : [...defaultProblems];
            updateHeaderStats();
        }

        function saveProblemsToStorage() {
            localStorage.setItem("math_app_problems", JSON.stringify(problems));
            updateHeaderStats();
        }

        function updateHeaderStats() {
            document.getElementById("header-stats").textContent = `問題数: ${problems.length}`;
        }

        function saveWebhookUrl() {
            const url = document.getElementById("webhook-url").value.trim();
            localStorage.setItem("math_app_webhook_url", url);
            alert("URLを保存しました。");
        }

        function loadWebhookUrl() {
            const savedUrl = localStorage.getItem("math_app_webhook_url");
            // 保存されたURLがなければ、GASのURLを初期値としてセット
            const defaultUrl = "https://script.google.com/macros/s/AKfycbzwHwh7l3YPTltD4TjAjp6us1qdgbVm9D2oDCIkbPm4j-KY8D-_TXVUvwHNGN5h2fVC/exec";

            const targetUrl = savedUrl || defaultUrl;
            document.getElementById("webhook-url").value = targetUrl;
            if (!savedUrl) {
                localStorage.setItem("math_app_webhook_url", defaultUrl);
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.getElementById(tabId).classList.remove("hidden");

            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            document.getElementById("nav-" + tabId).classList.add("active");

            if (tabId === 'tab-grading') renderGradingView();
            if (tabId === 'tab-board') resizeCanvas();
        }

        function renderPracticeProblem() {
            if (problems.length === 0) return;
            const problem = problems[currentProblemIndex];
            document.getElementById('problem-category').textContent = problem.category;
            
            const progressText = `問題 ${currentProblemIndex + 1} / ${problems.length}`;
            document.getElementById('practice-progress-text').textContent = progressText;
            document.getElementById('practice-counter').textContent = progressText;
            document.getElementById('practice-progress').style.width = `${((currentProblemIndex + 1) / problems.length) * 100}%`;

            document.getElementById('problem-statement').innerHTML = problem.statement;
            document.getElementById('user-answer').value = userAnswers[currentProblemIndex] || '';

            document.getElementById('btn-prev').disabled = (currentProblemIndex === 0);
            
            const isLast = (currentProblemIndex === problems.length - 1);
            document.getElementById('btn-next').classList.toggle('hidden', isLast);
            document.getElementById('btn-submit-all').classList.toggle('hidden', !isLast);

            saveAndPreviewAnswer();
            if (window.MathJax) MathJax.typesetPromise([document.getElementById('problem-statement')]);
        }

        function saveAndPreviewAnswer() {
            const val = document.getElementById('user-answer').value;
            userAnswers[currentProblemIndex] = val;
            const previewEl = document.getElementById('user-answer-preview');
            if (val.trim() === '') {
                previewEl.classList.add('hidden');
            } else {
                previewEl.classList.remove('hidden');
                previewEl.innerHTML = `\\(${val}\\)`;
                if (window.MathJax) MathJax.typesetPromise([previewEl]);
            }
        }

        function insertAnswerSymbol(symbol) {
            const input = document.getElementById('user-answer');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            input.value = input.value.substring(0, start) + symbol + input.value.substring(end);
            input.focus();
            saveAndPreviewAnswer();
        }

        function nextProblem() { if (currentProblemIndex < problems.length - 1) { currentProblemIndex++; renderPracticeProblem(); } }
        function prevProblem() { if (currentProblemIndex > 0) { currentProblemIndex--; renderPracticeProblem(); } }

        // メール自動提出処理
        async function submitToGrading() {
            const studentName = document.getElementById('student-name').value.trim() || '名無し生徒';
            const webhookUrl = localStorage.getItem('math_app_webhook_url');

            if (webhookUrl) {
                const payload = {
                    student: studentName,
                    timestamp: new Date().toLocaleString("ja-JP"),
                    answers: problems.map((p, idx) => ({
                        problemNo: idx + 1,
                        category: p.category,
                        statement: p.statement,
                        answer: userAnswers[idx] || "未入力"
                    }))
                };

                try {
                    await fetch(webhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("送信エラー:", e);
                }
            }

            document.getElementById('practice-card').classList.add('hidden');
            document.getElementById('submitted-card').classList.remove('hidden');
        }

        function resetPractice() {
            userAnswers = {};
            manualGrades = {};
            currentProblemIndex = 0;
            document.getElementById('submitted-card').classList.add('hidden');
            document.getElementById('practice-card').classList.remove('hidden');
            renderPracticeProblem();
        }

        function renderGradingView() {
            const listEl = document.getElementById('grading-list');
            listEl.innerHTML = '';
            let correctCount = 0;

            problems.forEach((p, idx) => {
                const userAns = (userAnswers[idx] || '').trim();
                const gradeStatus = manualGrades[idx];
                if (gradeStatus === true) correctCount++;

                let cardStyle = 'bg-white border-slate-200';
                if (gradeStatus === true) cardStyle = 'bg-emerald-50 border-emerald-200';
                if (gradeStatus === false) cardStyle = 'bg-rose-50 border-rose-200';

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl border ${cardStyle} space-y-3`;
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-sm text-slate-700">問 ${idx + 1} [${p.category}]</span>
                        <div class="flex gap-2">
                            <button onclick="setManualGrade(${idx}, true)" class="px-3 py-1 rounded text-sm font-bold ${gradeStatus === true ? 'bg-emerald-600 text-white' : 'bg-white border'}">◯ 正解</button>
                            <button onclick="setManualGrade(${idx}, false)" class="px-3 py-1 rounded text-sm font-bold ${gradeStatus === false ? 'bg-rose-600 text-white' : 'bg-white border'}">✕ 不正解</button>
                        </div>
                    </div>
                    <div class="text-slate-800 text-base font-medium">${p.statement}</div>
                    <div class="grid grid-cols-2 gap-2 text-sm pt-2 border-t">
                        <div class="bg-white p-2 rounded border"><span class="text-xs text-slate-400 block">生徒の解答</span>\\(${userAns || '未入力'}\\)</div>
                        <div class="bg-white p-2 rounded border"><span class="text-xs text-slate-400 block">模範解答</span>\\(${p.answer}\\)</div>
                    </div>
                `;
                listEl.appendChild(card);
            });

            document.getElementById('grading-score').textContent = `得点: ${correctCount} / ${problems.length} 問正解`;
            if (window.MathJax) MathJax.typesetPromise([listEl]);
        }

        function setManualGrade(index, isCorrect) {
            manualGrades[index] = isCorrect;
            renderGradingView();
        }

        function saveProblem(event) {
            event.preventDefault();
            const editId = document.getElementById('edit-problem-id').value;
            const category = document.getElementById('input-category').value;
            const statement = document.getElementById('input-statement').value;
            const answer = document.getElementById('input-answer').value;
            const explanation = document.getElementById('input-explanation').value;

            if (editId !== "") {
                const index = problems.findIndex(p => String(p.id) === String(editId));
                if (index !== -1) problems[index] = { id: Number(editId), category, statement, answer, explanation };
            } else {
                const newId = problems.length > 0 ? Math.max(...problems.map(p => Number(p.id) || 0)) + 1 : 1;
                problems.push({ id: newId, category, statement, answer, explanation });
            }

            saveProblemsToStorage();
            resetForm();
            renderProblemsList();
            renderPracticeProblem();
        }

        function editProblem(id) {
            const p = problems.find(item => String(item.id) === String(id));
            if (!p) return;
            document.getElementById('edit-problem-id').value = p.id;
            document.getElementById('input-category').value = p.category;
            document.getElementById('input-statement').value = p.statement;
            document.getElementById('input-answer').value = p.answer;
            document.getElementById('input-explanation').value = p.explanation;
            document.getElementById('form-title').textContent = "問題の編集";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');
        }

        function deleteProblem(id) {
            if (confirm("削除しますか？")) {
                problems = problems.filter(p => String(p.id) !== String(id));
                saveProblemsToStorage();
                renderProblemsList();
                renderPracticeProblem();
            }
        }

        function resetForm() {
            document.getElementById('problem-form').reset();
            document.getElementById('edit-problem-id').value = '';
            document.getElementById('form-title').textContent = "問題の追加";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        function renderProblemsList() {
            const listEl = document.getElementById('problems-list');
            listEl.innerHTML = '';
            problems.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'py-3 flex justify-between items-center';
                item.innerHTML = `
                    <div>
                        <span class="text-xs bg-slate-100 px-2 py-0.5 rounded font-semibold">問 ${idx + 1} (${p.category})</span>
                        <div class="text-sm font-medium mt-1">${p.statement}</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button type="button" onclick="editProblem('${p.id}')" class="text-xs text-blue-600 border px-2 py-1 rounded">編集</button>
                        <button type="button" onclick="deleteProblem('${p.id}')" class="text-xs text-rose-600 border px-2 py-1 rounded">削除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });
            if (window.MathJax) MathJax.typesetPromise([listEl]);
        }

        // キャンバス機能
        let canvas, ctx, isDrawing = false, isEraser = false, currentColor = '#1e293b';
        function initCanvas() {
            canvas = document.getElementById('memo-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('touchstart', e => { e.preventDefault(); startDrawing(e.touches[0]); }, { passive: false });
            canvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); }, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }
        function resizeCanvas() { if (canvas) { canvas.width = canvas.parentElement.getBoundingClientRect().width; canvas.height = canvas.parentElement.getBoundingClientRect().height; } }
        function setPenColor(c) { isEraser = false; currentColor = c; }
        function toggleEraser() { isEraser = !isEraser; }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function startDrawing(e) { isDrawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); }
        function draw(e) {
            if (!isDrawing) return;
            const p = getPos(e);
            ctx.lineWidth = isEraser ? 20 : 3;
            ctx.lineCap = 'round';
            ctx.globalCompositeOperation = isEraser ? 'destination-out' : 'source-over';
            ctx.strokeStyle = currentColor;
            ctx.lineTo(p.x, p.y);
            ctx.stroke();
        }
        function stopDrawing() { isDrawing = false; }
        function getPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    </script>
</body>
</html>
