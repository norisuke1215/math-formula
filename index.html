<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学問題演習アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MathJax for rendering math equations -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            svg: {
                fontCache: 'global'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        /* Custom styles for canvas and touch interactions */
        body {
            user-select: none;
            -webkit-user-select: none;
        }
        input, textarea {
            user-select: text;
            -webkit-user-select: text;
        }
        .tab-btn.active {
            color: #3b82f6;
            border-top: 3px solid #3b82f6;
            background-color: #eff6ff;
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between pb-20">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg">
                    $\sum$
                </div>
                <h1 class="text-xl font-bold text-slate-800">数学演習 </h1>
            </div>
            <span class="text-xs bg-blue-100 text-blue-700 px-2.5 py-1 rounded-full font-medium" id="header-stats">問題数: 0</span>
        </div>
    </header>

    <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-grow">

        <!-- TAB 1: PRACTICE SECTION -->
        <section id="tab-practice" class="tab-content block space-y-6">
            <!-- Progress Bar Card -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-500 uppercase">学習進捗</span>
                    <span id="practice-counter" class="text-xs font-bold text-blue-600">問題 1 / 1</span>
                </div>
                <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div id="practice-progress" class="bg-blue-600 h-2.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

<!-- Question Card -->
            <div id="practice-card" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                    <span id="problem-category" class="bg-indigo-50 text-indigo-600 text-xs px-3 py-1 rounded-md font-semibold">カテゴリ</span>
                    <span id="practice-progress-text" class="text-xs text-slate-500 font-medium">問題 1 / 1</span>
                </div>

                <div class="py-2">
                    <h2 class="text-sm text-slate-400 font-medium mb-1">【問題】</h2>
                    <div id="problem-statement" class="text-lg md:text-xl text-slate-800 font-medium leading-relaxed min-h-[60px] flex items-center">
                        問題文がここに表示されます。
                    </div>
                </div>

                <!-- Answer Input Form -->
                <div class="pt-2 border-t border-slate-100 space-y-3">
                    <label class="block text-sm font-medium text-slate-700">あなたの解答</label>
                    
                    <!-- 数式入力補助ボタン -->
                    <div class="flex flex-wrap gap-1 mb-2">
                        <button type="button" onclick="insertAnswerSymbol('\\int_{a}^{b}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">∫</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sum_{k=1}^{n}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">∑</button>
                        <button type="button" onclick="insertAnswerSymbol('{}_n \\mathrm{C}_r')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">${}_n \mathrm{C}_r$</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sqrt{}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">√</button>
                        <button type="button" onclick="insertAnswerSymbol('\\pi')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">π</button>
                        <button type="button" onclick="insertAnswerSymbol('\\theta')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">θ</button>
                        <button type="button" onclick="insertAnswerSymbol('\\infty')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">∞</button>
                        <button type="button" onclick="insertAnswerSymbol('^2')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">x²</button>
                        <button type="button" onclick="insertAnswerSymbol('^3')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">x³</button>
                        <button type="button" onclick="insertAnswerSymbol('\\frac{a}{b}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">½</button>
                        <button type="button" onclick="insertAnswerSymbol('a_{n}')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">$a_n$</button>
                        <button type="button" onclick="insertAnswerSymbol('\\sin x')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">$\sin x$</button>
                        <button type="button" onclick="insertAnswerSymbol('\\cos x')" class="px-2 py-1 text-xs bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded text-slate-700 font-mono">$\cos x$</button>
                    </div>

                    <div class="flex gap-2">
                        <input type="text" id="user-answer" placeholder="答えを入力" oninput="saveAndPreviewAnswer()" class="flex-grow px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg">
                    </div>

                    <!-- リアルタイム数式プレビュー -->
                    <div id="user-answer-preview" class="hidden p-3 bg-slate-50 border-l-4 border-blue-500 rounded-r-xl text-slate-800 text-lg min-h-[50px]"></div>
                </div>

                <!-- ナビゲーション・一括採点ボタン -->
                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                    <button id="btn-prev" onclick="prevProblem()" class="px-4 py-2.5 bg-white border border-slate-300 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition flex items-center gap-2 shadow-sm text-sm">
                        <i class="fa-solid fa-chevron-left text-xs"></i> 前の問題
                    </button>
                    <button id="btn-next" onclick="nextProblem()" class="px-4 py-2.5 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition flex items-center gap-2 shadow-sm text-sm">
                        次の問題 <i class="fa-solid fa-chevron-right text-xs"></i>
                    </button>
                    <button id="btn-submit-all" onclick="submitAllAnswers()" class="hidden px-5 py-2.5 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition shadow-sm text-sm">
                        まとめて採点する
                    </button>
                </div>
            </div>

            <!-- 採点結果画面（初期表示は非表示） -->
            <div id="results-card" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
                <div class="text-center space-y-2 pb-4 border-b border-slate-100">
                    <h2 class="text-2xl font-bold text-slate-800">採点結果</h2>
                    <div id="score-text" class="text-3xl font-extrabold text-blue-600"></div>
                </div>

                <!-- 全問題の正誤・解答・解説リスト -->
                <div id="results-list" class="space-y-6"></div>

                <button onclick="resetPractice()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition shadow-sm">
                    もう一度挑戦する
                </button>
            </div>
        </section>

        <!-- TAB 2: MANAGEMENT SECTION -->
        <section id="tab-manage" class="tab-content hidden space-y-6">
            <!-- Add / Edit Problem Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                <div class="flex justify-between items-center">
                    <h2 id="form-title" class="text-lg font-bold text-slate-800">新しい問題の追加</h2>
                    <button id="btn-cancel-edit" onclick="resetForm()" class="hidden text-xs text-rose-500 hover:underline">編集をキャンセル</button>
                </div>

                <form id="problem-form" onsubmit="saveProblem(event)" class="space-y-4">
                    <input type="hidden" id="edit-problem-id" value="">

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">カテゴリー / 単元</label>
                        <input type="text" id="input-category" required placeholder="例: 微分・積分、二次関数" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>

                    <!-- Problem Statement Input with Math Shortcuts -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-semibold text-slate-600">問題文 (TeX数式は $ で囲む)</label>
                        </div>
                        
                        <!-- Math Symbol Helper Toolbar -->
                        <div class="flex flex-wrap gap-1 p-2 bg-slate-50 border border-slate-200 rounded-t-lg text-sm">
                            <span class="text-xs text-slate-400 self-center mr-1">数式記号:</span>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\int_{a}^{b} f(x)dx$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\int$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\sum_{k=1}^{n}$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\sum$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '{}_n \\mathrm{C}_r')" class="px-2 py-1 text-xs bg-white border border-slate-300 rounded hover:bg-slate-100 font-mono">${}_n \mathrm{C}_r$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\sqrt{x}$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\sqrt{}$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\pi$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\pi$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\theta$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\theta$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '$\\infty$')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\infty$</button>
                            <button type="button" onclick="insertSymbol('input-statement', 'x^2')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$x^2$</button>
                            <button type="button" onclick="insertSymbol('input-statement', 'x^3')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$x^3$</button>
                            <button type="button" onclick="insertSymbol('input-statement', '\\frac{a}{b}')" class="px-2 py-1 bg-white border border-slate-300 rounded hover:bg-slate-100 text-xs font-mono">$\frac{a}{b}$</button>
                        </div>

                        <textarea id="input-statement" required rows="3" placeholder="問題文を入力してください。例: $\int_{0}^{1} 2x \, dx$ の値を求めよ。" class="w-full px-3 py-2 rounded-b-lg border border-slate-300 border-t-0 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <!-- Answer Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">正解 (半角推奨)</label>
                        <input type="text" id="input-answer" required placeholder="例: 1" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>

                    <!-- Explanation Input -->
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">解説</label>
                        <textarea id="input-explanation" required rows="3" placeholder="解法の手順やポイントを入力してください。" class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
                    </div>

                    <button type="submit" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition duration-200 shadow-sm text-sm">
                        問題を登録保存する
                    </button>
                </form>
            </div>

            <!-- Existing Problems List -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-lg font-bold text-slate-800">問題一覧</h2>
                <div id="problems-list" class="divide-y divide-slate-100">
                    <!-- Dynamic problem items go here -->
                </div>
            </div>
        </section>

        <!-- TAB 3: BOARD / CANVAS MEMO SECTION -->
        <section id="tab-board" class="tab-content hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-2 border-b pb-3 border-slate-100">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-pen-ruler text-blue-600"></i> 計算用紙・板書メモ
                    </h2>
                    
                    <!-- Canvas Controls -->
                    <div class="flex items-center gap-2">
                        <!-- Color Selector -->
                        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg">
                            <button onclick="setPenColor('#1e293b')" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white focus:ring-2 focus:ring-blue-400" title="黒"></button>
                            <button onclick="setPenColor('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white focus:ring-2 focus:ring-blue-400" title="赤"></button>
                            <button onclick="setPenColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white focus:ring-2 focus:ring-blue-400" title="青"></button>
                        </div>
                        
                        <!-- Tool Mode Toggle -->
                        <button id="btn-eraser" onclick="toggleEraser()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold transition">
                            <i class="fa-solid fa-eraser"></i> 消しゴム
                        </button>

                        <!-- Clear Canvas Button -->
                        <button onclick="clearCanvas()" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg text-xs font-semibold transition">
                            <i class="fa-solid fa-trash-can"></i> 全消去
                        </button>
                    </div>
                </div>

                <div class="relative w-full bg-slate-50 border border-slate-200 rounded-xl overflow-hidden" style="height: 450px;">
                    <canvas id="memo-canvas" class="w-full h-full cursor-crosshair"></canvas>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40">
        <div class="max-w-3xl mx-auto flex justify-around">
            <button onclick="switchTab('tab-practice')" id="nav-tab-practice" class="tab-btn active flex-1 py-3 flex flex-col items-center gap-1 text-slate-500 text-xs font-semibold transition">
                <i class="fa-solid fa-graduation-cap text-base"></i> 問題演習
            </button>
            <button onclick="switchTab('tab-manage')" id="nav-tab-manage" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1 text-slate-500 text-xs font-semibold transition">
                <i class="fa-solid fa-list-check text-base"></i> 問題管理
            </button>
            <button onclick="switchTab('tab-board')" id="nav-tab-board" class="tab-btn flex-1 py-3 flex flex-col items-center gap-1 text-slate-500 text-xs font-semibold transition">
                <i class="fa-solid fa-pen-to-square text-base"></i> 計算用紙
            </button>
        </div>
    </nav>

    <!-- JavaScript Logic -->
    <script>
        // デフォルト問題データ
        const defaultProblems = [
            {
                id: 1,
                category: "積分法",
                statement: "$\\int_{0}^{1} 2x \\, dx$ を計算せよ。",
                answer: "1",
                explanation: "不定積分は $\\int 2x dx = x^2 + C$ となります。<br>定積分の公式に当てはめると、$[x^2]_{0}^{1} = 1^2 - 0^2 = 1$ となります。"
            },
            {
                id: 2,
                category: "二次関数",
                statement: "二次関数 $y = x^2 - 4x + 3$ の頂点の $y$ 座標を求めよ。",
                answer: "-1",
                explanation: "平方完成を行うと、$y = (x - 2)^2 - 4 + 3 = (x - 2)^2 - 1$ となります。<br>したがって、頂点は $(2, -1)$ であり、$y$ 座標は $-1$ です。"
            }
        ];

        // アプリケーション状態変数
        let problems = [];
        let currentProblemIndex = 0;
        let userAnswers = {}; // 各問題に対するユーザーの入力を保持

        // 初期化処理
        document.addEventListener("DOMContentLoaded", () => {
            loadProblems();
            renderPracticeProblem();
            renderProblemsList();
            initCanvas();
        });

        // LocalStorage から問題データを取得（無ければデフォルト）
        function loadProblems() {
            const saved = localStorage.getItem("math_app_problems");
            if (saved) {
                try {
                    problems = JSON.parse(saved);
                } catch (e) {
                    problems = [...defaultProblems];
                }
            } else {
                problems = [...defaultProblems];
                saveProblemsToStorage();
            }
            updateHeaderStats();
        }

        function saveProblemsToStorage() {
            localStorage.setItem("math_app_problems", JSON.stringify(problems));
            updateHeaderStats();
        }

        function updateHeaderStats() {
            document.getElementById("header-stats").textContent = `問題数: ${problems.length}`;
        }

        // --- タブ切り替え ---
        function switchTab(tabId) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.add("hidden"));
            document.getElementById(tabId).classList.remove("hidden");

            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            document.getElementById("nav-" + tabId).classList.add("active");

            if (tabId === 'tab-board') {
                resizeCanvas();
            }
        }

        // --- 問題演習ロジック ---
        function renderPracticeProblem() {
            if (problems.length === 0) {
                document.getElementById('problem-statement').innerHTML = "問題が登録されていません。「問題管理」から追加してください。";
                return;
            }

            const problem = problems[currentProblemIndex];
            document.getElementById('problem-category').textContent = problem.category;
            
            const progressText = `問題 ${currentProblemIndex + 1} / ${problems.length}`;
            document.getElementById('practice-progress-text').textContent = progressText;
            document.getElementById('practice-counter').textContent = progressText;
            
            const progressPercent = ((currentProblemIndex + 1) / problems.length) * 100;
            document.getElementById('practice-progress').style.width = `${progressPercent}%`;

            document.getElementById('problem-statement').innerHTML = problem.statement;

            // 入力欄の復元
            const currentInput = userAnswers[currentProblemIndex] || '';
            const answerInput = document.getElementById('user-answer');
            if (answerInput) answerInput.value = currentInput;

            // ボタン制御
            const prevBtn = document.getElementById('btn-prev');
            if (prevBtn) {
                prevBtn.disabled = (currentProblemIndex === 0);
                prevBtn.classList.toggle('opacity-50', currentProblemIndex === 0);
            }

            const isLast = (currentProblemIndex === problems.length - 1);
            const nextBtn = document.getElementById('btn-next');
            const submitBtn = document.getElementById('btn-submit-all');
            
            if (nextBtn) nextBtn.classList.toggle('hidden', isLast);
            if (submitBtn) submitBtn.classList.toggle('hidden', !isLast);

            saveAndPreviewAnswer();

            if (window.MathJax) {
                MathJax.typesetPromise([document.getElementById('problem-statement')]);
            }
        }

        function saveAndPreviewAnswer() {
            const val = document.getElementById('user-answer').value;
            userAnswers[currentProblemIndex] = val;

            const previewEl = document.getElementById('user-answer-preview');
            if (val.trim() === '') {
                previewEl.classList.add('hidden');
            } else {
                previewEl.classList.remove('hidden');
                previewEl.innerHTML = `\\(${val}\\)`;
                if (window.MathJax) {
                    MathJax.typesetPromise([previewEl]);
                }
            }
        }

        function insertAnswerSymbol(symbol) {
            const input = document.getElementById('user-answer');
            const start = input.selectionStart;
            const end = input.selectionEnd;
            const text = input.value;

            input.value = text.substring(0, start) + symbol + text.substring(end);
            input.focus();
            input.selectionStart = input.selectionEnd = start + symbol.length;

            saveAndPreviewAnswer();
        }

        function nextProblem() {
            if (currentProblemIndex < problems.length - 1) {
                currentProblemIndex++;
                renderPracticeProblem();
            }
        }

        function prevProblem() {
            if (currentProblemIndex > 0) {
                currentProblemIndex--;
                renderPracticeProblem();
            }
        }

// --- 数式表記の揺れを吸収して標準化する関数 ---
        function normalizeMathExpression(expr) {
            if (!expr) return "";

            let str = String(expr).trim();

            // 1. TeXの数式囲み記号（$, \(,\) など）や全角スペース・半角スペースを削除
            str = str.replace(/[\$\\(\\\)]/g, "");
            str = str.replace(/[\s\u3000]/g, "");

            // 2. 全角英数字・記号を半角に変換
            str = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xfee0);
            });
            str = str.replace(/＋/g, "+").replace(/－/g, "-").replace(/＝/g, "=")
                     .replace(/／/g, "/").replace(/＊/g, "*");

            // 3. LaTeX表記の表記ブレを統一化
            // 冪乗のカッコ省略: x^{2} -> x^2
            str = str.replace(/\^{?([0-9a-zA-Z])}?/g, "^$1");
            // 添字のカッコ省略: a_{n} -> a_n
            str = str.replace(/_{?([0-9a-zA-Z])}?/g, "_$1");
            // 分数表記: \frac{a}{b} -> a/b (単純な分数)
            str = str.replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, "($1)/($2)");
            // 不要な波カッコ {} の除去
            str = str.replace(/[\{\}]/g, "");

            // 4. 定数やよく使う記号の表記統一
            str = str.replace(/\\pi/g, "π");
            str = str.replace(/\\theta/g, "θ");
            str = str.replace(/\\infty/g, "∞");
            str = str.replace(/\\sqrt/g, "√");

            return str.toLowerCase();
        }

        // --- まとめ採点機能（修正版） ---
        function submitAllAnswers() {
            let score = 0;
            const resultsList = document.getElementById('results-list');
            resultsList.innerHTML = '';

            problems.forEach((p, idx) => {
                const rawUserAns = (userAnswers[idx] || '').trim();
                const rawCorrectAns = (p.answer || '').trim();

                // 表示上の標準化を行って比較
                const normUser = normalizeMathExpression(rawUserAns);
                const normCorrect = normalizeMathExpression(rawCorrectAns);

                // 完全一致または標準化後の表記一致で正解とみなす
                const isCorrect = (normUser !== "" && normUser === normCorrect);
                if (isCorrect) score++;

                const resultItem = document.createElement('div');
                resultItem.className = `p-4 rounded-xl border ${isCorrect ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'} space-y-2`;
                resultItem.innerHTML = `
                    <div class="flex items-center justify-between font-bold">
                        <span class="${isCorrect ? 'text-emerald-700' : 'text-rose-700'}">問${idx + 1}: ${isCorrect ? '正解 🎉' : '不正解 ❌'}</span>
                        <span class="text-xs text-slate-500">${p.category}</span>
                    </div>
                    <div class="text-slate-800">${p.statement}</div>
                    <div class="text-sm text-slate-600">あなたの解答: <span class="font-semibold">${rawUserAns ? '\\(' + rawUserAns + '\\)' : '未入力'}</span></div>
                    <div class="text-sm text-slate-600">正解: <span class="font-semibold">\\(${rawCorrectAns}\\)</span></div>
                    <div class="text-sm bg-white p-3 rounded-lg border border-slate-200 text-slate-700 mt-2"><strong>解説:</strong> ${p.explanation}</div>
                `;
                resultsList.appendChild(resultItem);
            });

            document.getElementById('score-text').textContent = `${problems.length}問中 ${score}問 正解！`;

            document.getElementById('practice-card').classList.add('hidden');
            document.getElementById('results-card').classList.remove('hidden');

            if (window.MathJax) {
                MathJax.typesetPromise([resultsList]);
            }
        }

        function resetPractice() {
            userAnswers = {};
            currentProblemIndex = 0;
            document.getElementById('results-card').classList.add('hidden');
            document.getElementById('practice-card').classList.remove('hidden');
            renderPracticeProblem();
        }

// --- 問題管理機能（修正版） ---
        function insertSymbol(targetId, symbol) {
            const textarea = document.getElementById(targetId);
            if (!textarea) return;
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;

            textarea.value = text.substring(0, start) + symbol + text.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + symbol.length;
        }

        function saveProblem(event) {
            event.preventDefault();
            const editId = document.getElementById('edit-problem-id').value;
            const category = document.getElementById('input-category').value;
            const statement = document.getElementById('input-statement').value;
            const answer = document.getElementById('input-answer').value;
            const explanation = document.getElementById('input-explanation').value;

            if (editId !== "") {
                // 編集時の処理
                const index = problems.findIndex(p => String(p.id) === String(editId));
                if (index !== -1) {
                    problems[index] = { id: Number(editId), category, statement, answer, explanation };
                }
            } else {
                // 新規追加時の処理
                const newId = problems.length > 0 ? Math.max(...problems.map(p => Number(p.id) || 0)) + 1 : 1;
                problems.push({ id: newId, category, statement, answer, explanation });
            }

            saveProblemsToStorage();
            resetForm();
            renderProblemsList();
            renderPracticeProblem();
            alert(editId !== "" ? "問題を更新しました。" : "新しい問題を登録しました。");
        }

        function editProblem(id) {
            // 文字列・数値のどちらでも一致するように比較
            const problem = problems.find(p => String(p.id) === String(id));
            if (!problem) return;

            document.getElementById('edit-problem-id').value = problem.id;
            document.getElementById('input-category').value = problem.category || '';
            document.getElementById('input-statement').value = problem.statement || '';
            document.getElementById('input-answer').value = problem.answer || '';
            document.getElementById('input-explanation').value = problem.explanation || '';

            document.getElementById('form-title').textContent = "問題を編集";
            document.getElementById('btn-save').textContent = "更新内容を保存する";
            document.getElementById('btn-cancel-edit').classList.remove('hidden');

            // フォームのある上部へスムーズスクロール
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProblem(id) {
            if (confirm("この問題を削除してもよろしいですか？")) {
                problems = problems.filter(p => String(p.id) !== String(id));
                saveProblemsToStorage();
                renderProblemsList();
                if (currentProblemIndex >= problems.length) {
                    currentProblemIndex = Math.max(0, problems.length - 1);
                }
                renderPracticeProblem();
            }
        }

        function resetForm() {
            document.getElementById('problem-form').reset();
            document.getElementById('edit-problem-id').value = '';
            document.getElementById('form-title').textContent = "新しい問題の追加";
            document.getElementById('btn-save').textContent = "問題を登録保存する";
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        function renderProblemsList() {
            const listEl = document.getElementById('problems-list');
            if (!listEl) return;
            listEl.innerHTML = '';

            if (problems.length === 0) {
                listEl.innerHTML = '<p class="text-sm text-slate-400 py-4 text-center">登録された問題はありません。</p>';
                return;
            }

            problems.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'py-4 flex justify-between items-start gap-4';
                
                // HTML生成時にIDを安全に渡すように修正
                item.innerHTML = `
                    <div class="space-y-1 flex-grow">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-semibold">問 ${idx + 1}</span>
                            <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded font-semibold">${p.category}</span>
                        </div>
                        <div class="text-sm text-slate-800 font-medium">${p.statement}</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button type="button" onclick="editProblem('${p.id}')" class="text-xs text-blue-600 hover:bg-blue-50 px-3 py-1.5 rounded border border-blue-200 font-semibold transition">編集</button>
                        <button type="button" onclick="deleteProblem('${p.id}')" class="text-xs text-rose-600 hover:bg-rose-50 px-3 py-1.5 rounded border border-rose-200 font-semibold transition">削除</button>
                    </div>
                `;
                listEl.appendChild(item);
            });

            if (window.MathJax) {
                MathJax.typesetPromise([listEl]);
            }
        }

        // --- キャンバス（手書きメモ）機能 ---
        let canvas, ctx;
        let isDrawing = false;
        let isEraser = false;
        let currentColor = '#1e293b';

        function initCanvas() {
            canvas = document.getElementById('memo-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();

            // イベントリスナー設定
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        }

        function resizeCanvas() {
            if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function setPenColor(color) {
            isEraser = false;
            currentColor = color;
            document.getElementById('btn-eraser').classList.remove('bg-amber-100', 'text-amber-700');
        }

        function toggleEraser() {
            isEraser = !isEraser;
            const btn = document.getElementById('btn-eraser');
            btn.classList.toggle('bg-amber-100', isEraser);
            btn.classList.toggle('text-amber-700', isEraser);
        }

        function clearCanvas() {
            if (ctx && canvas) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);

            ctx.lineWidth = isEraser ? 20 : 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (isEraser) {
                ctx.globalCompositeOperation = 'destination-out';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = currentColor;
            }

            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            startDrawing(touch);
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            draw(touch);
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }
    </script>
</body>
